<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurgency Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --background: #1a1a2e;
            --surface: #16213e;
            --surface-light: #1f2b4d;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        .sidebar {
            width: 80px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-size: 24px;
            position: relative;
        }

        .sidebar-icon:hover {
            background: var(--surface-light);
            color: var(--text);
            transform: translateX(5px);
        }

        .sidebar-icon.active {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.5);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            height: 60px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar-title {
            font-size: 18px;
            font-weight: 600;
        }

        .run-button {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .run-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .run-button:active {
            transform: translateY(0);
        }

        .run-button.running {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .stat-card:hover {
            background: var(--surface-light);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .config-section {
            background: var(--surface);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .url-list {
            list-style: none;
            margin-top: 10px;
        }

        .url-item {
            background: var(--surface-light);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            transition: all 0.3s ease;
        }

        .url-item:hover {
            background: rgba(108, 92, 231, 0.2);
        }

        .url-item.dragging {
            opacity: 0.5;
            border: 2px dashed var(--primary);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .add-url-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .add-url-btn:hover {
            background: #5f4fd8;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-online {
            background: var(--success);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.7);
        }

        .status-offline {
            background: var(--danger);
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-icon active" data-section="home" title="Home">🏠</div>
        <div class="sidebar-icon" data-section="config" title="Configuration">⚙️</div>
        <div class="sidebar-icon" data-section="packages" title="Packages">📦</div>
        <div class="sidebar-icon" data-section="settings" title="Settings">🔧</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="top-bar-title">
                <span class="status-indicator status-online"></span>
                Insurgency Control Panel
            </div>
            <button class="run-button" id="runButton" onclick="toggleBot()">
                <span id="runIcon">▶</span>
                <span id="runText">Run Bot</span>
            </button>
        </div>

        <div class="content-area">
            <!-- Home Section -->
            <div class="section active" id="home-section">
                <h2>Dashboard</h2>
                <div class="home-grid">
                    <div class="stat-card" onclick="navigateToSection('config')">
                        <div class="stat-number" id="urlCount">0</div>
                        <div class="stat-label">Configured URLs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="runCount">0</div>
                        <div class="stat-label">Total Runs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="successRate">0%</div>
                        <div class="stat-label">Success Rate</div>
                    </div>
                </div>
            </div>

            <!-- Config Section -->
            <div class="section" id="config-section">
                <h2>URL Configuration</h2>
                <div class="config-section">
                    <div class="input-group">
                        <label>Add Subreddit URL</label>
                        <input type="text" class="input-field" id="subredditInput" 
                               placeholder="Enter subreddit name (e.g., MakeupAddiction)" 
                               onkeypress="if(event.key === 'Enter') addUrl()">
                        <button class="add-url-btn" onclick="addUrl()">Add URL</button>
                    </div>
                    <div class="input-group">
                        <label>Configured URLs (Drag to reorder)</label>
                        <ul class="url-list" id="urlList"></ul>
                    </div>
                </div>
            </div>

            <!-- Packages Section -->
            <div class="section" id="packages-section">
                <h2>Packages</h2>
                <p style="color: #a0a0a0; margin-top: 20px;">Package management coming soon...</p>
            </div>

            <!-- Settings Section -->
            <div class="section" id="settings-section">
                <h2>Settings</h2>
                <div class="config-section">
                    <div class="input-group">
                        <label>Post Title</label>
                        <input type="text" class="input-field" id="postTitle" 
                               placeholder="Enter post title" value="">
                    </div>
                    <div class="input-group">
                        <label>Image URL 1</label>
                        <input type="text" class="input-field" id="imageUrl1" 
                               placeholder="Enter first image URL">
                    </div>
                    <div class="input-group">
                        <label>Image URL 2</label>
                        <input type="text" class="input-field" id="imageUrl2" 
                               placeholder="Enter second image URL">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let draggedItem = null;

        // Initialize from localStorage
        function loadData() {
            // Load URLs
            const urls = JSON.parse(localStorage.getItem('urls') || '[]');
            urls.forEach(url => addUrlToList(url));
            
            // Load settings
            document.getElementById('postTitle').value = localStorage.getItem('postTitle') || '';
            document.getElementById('imageUrl1').value = localStorage.getItem('imageUrl1') || '';
            document.getElementById('imageUrl2').value = localStorage.getItem('imageUrl2') || '';
            
            updateStats();
        }

        // Save to localStorage
        function saveData(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const urls = getUrls();
            const runCount = parseInt(localStorage.getItem('runCount') || '0');
            const successCount = parseInt(localStorage.getItem('successCount') || '0');
            
            document.getElementById('urlCount').textContent = urls.length;
            document.getElementById('runCount').textContent = runCount;
            document.getElementById('successRate').textContent = 
                runCount > 0 ? Math.round((successCount / runCount) * 100) + '%' : '0%';
        }

        // Get all URLs
        function getUrls() {
            return JSON.parse(localStorage.getItem('urls') || '[]');
        }

        // Add URL
        function addUrl() {
            const input = document.getElementById('subredditInput');
            const subreddit = input.value.trim();
            
            if (subreddit) {
                const url = `https://www.reddit.com/r/${subreddit}/`;
                const urls = getUrls();
                urls.push(url);
                saveData('urls', urls);
                addUrlToList(url);
                input.value = '';
            }
        }

        // Add URL to list
        function addUrlToList(url) {
            const list = document.getElementById('urlList');
            const li = document.createElement('li');
            li.className = 'url-item';
            li.draggable = true;
            li.innerHTML = `
                <span>${url}</span>
                <button class="delete-btn" onclick="deleteUrl(this, '${url}')">Delete</button>
            `;
            
            // Drag and drop handlers
            li.addEventListener('dragstart', handleDragStart);
            li.addEventListener('dragover', handleDragOver);
            li.addEventListener('drop', handleDrop);
            li.addEventListener('dragend', handleDragEnd);
            
            list.appendChild(li);
        }

        // Delete URL
        function deleteUrl(btn, url) {
            const urls = getUrls().filter(u => u !== url);
            saveData('urls', urls);
            btn.parentElement.remove();
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (draggedItem !== this) {
                const list = document.getElementById('urlList');
                const items = Array.from(list.children);
                const fromIndex = items.indexOf(draggedItem);
                const toIndex = items.indexOf(this);
                
                if (fromIndex < toIndex) {
                    this.parentNode.insertBefore(draggedItem, this.nextSibling);
                } else {
                    this.parentNode.insertBefore(draggedItem, this);
                }
                
                // Update localStorage order
                const urls = Array.from(list.children).map(li => 
                    li.querySelector('span').textContent
                );
                saveData('urls', urls);
            }
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedItem = null;
        }

        // Toggle bot
        function toggleBot() {
            if (isRunning) {
                stopBot();
            } else {
                startBot();
            }
        }

        function startBot() {
            const urls = getUrls();
            if (urls.length === 0) {
                alert('Please add at least one URL first');
                return;
            }
            
            isRunning = true;
            document.getElementById('runButton').classList.add('running');
            document.getElementById('runIcon').textContent = '⏸';
            document.getElementById('runText').textContent = 'Stop Bot';
            
            // Save current settings
            localStorage.setItem('postTitle', document.getElementById('postTitle').value);
            localStorage.setItem('imageUrl1', document.getElementById('imageUrl1').value);
            localStorage.setItem('imageUrl2', document.getElementById('imageUrl2').value);
            
            // Send message to C# application
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'startBot',
                    urls: urls,
                    settings: {
                        title: document.getElementById('postTitle').value,
                        imageUrl1: document.getElementById('imageUrl1').value,
                        imageUrl2: document.getElementById('imageUrl2').value
                    }
                });
            }
            
            // Update run count
            const runCount = parseInt(localStorage.getItem('runCount') || '0');
            localStorage.setItem('runCount', runCount + 1);
            updateStats();
        }

        function stopBot() {
            isRunning = false;
            document.getElementById('runButton').classList.remove('running');
            document.getElementById('runIcon').textContent = '▶';
            document.getElementById('runText').textContent = 'Run Bot';
            
            // Notify C# application to stop
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'stopBot'
                });
            }
        }

        // Navigate between sections
        function navigateToSection(section) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(s => s.classList.remove('active'));
            document.getElementById(section + '-section').classList.add('active');
            
            const icons = document.querySelectorAll('.sidebar-icon');
            icons.forEach(i => i.classList.remove('active'));
            document.querySelector(`[data-section="${section}"]`).classList.add('active');
        }

        // Handle messages from C#
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'botCompleted') {
                    stopBot();
                    const successCount = parseInt(localStorage.getItem('successCount') || '0');
                    localStorage.setItem('successCount', successCount + 1);
                    updateStats();
                }
            });
        }

        // Event listeners
        document.querySelectorAll('.sidebar-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                navigateToSection(icon.dataset.section);
            });
        });

        // Load data on startup
        loadData();
    </script>
</body>
</html>
