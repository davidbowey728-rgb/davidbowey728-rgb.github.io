<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inferno Loader</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
    }

    body {
        background: radial-gradient(circle at center,
                #1a0000 0%,
                #0a0a0a 45%,
                #000000 100%);
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
    }

    /* =========================
       INFERNO TITLE
    ========================= */

    .title {
        font-size: 4rem;
        font-weight: 900;
        letter-spacing: 10px;
        margin-bottom: 40px;
        text-transform: uppercase;

        background: linear-gradient(
            180deg,
            #fff7c5,
            #ffcb45,
            #ff7b00,
            #ff3000,
            #7a0000
        );

        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation:
            fireGlow 3s infinite ease-in-out,
            flameMove 5s infinite linear;
    }

    @keyframes flameMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes fireGlow {

        0% {
            filter:
                drop-shadow(0 0 8px #ff3300)
                drop-shadow(0 0 15px #ff6600);
        }

        50% {
            filter:
                drop-shadow(0 0 18px #ff7700)
                drop-shadow(0 0 35px #ff2200);
        }

        100% {
            filter:
                drop-shadow(0 0 8px #ff3300)
                drop-shadow(0 0 15px #ff6600);
        }
    }

    /* =========================
       SPINNER
    ========================= */

    .spinner-container {
        position: relative;
        width: 180px;
        height: 180px;
        margin: auto;
    }

    .outer-ring,
    .middle-ring,
    .inner-ring {
        position: absolute;
        border-radius: 50%;
    }

    .outer-ring {
        width: 180px;
        height: 180px;
        border-top: 8px solid #ff9900;
        border-right: 8px solid #ff3300;
        border-left: 8px solid transparent;
        border-bottom: 8px solid transparent;

        animation: rotateClockwise 3s linear infinite;

        box-shadow:
            0 0 20px #ff3300,
            0 0 50px #ff6600;
    }

    .middle-ring {
        top: 25px;
        left: 25px;

        width: 130px;
        height: 130px;

        border-top: 6px solid #ffd000;
        border-right: 6px solid #ff5500;
        border-left: 6px solid transparent;
        border-bottom: 6px solid transparent;

        animation: rotateCounter 2.2s linear infinite;
    }

    .inner-ring {
        top: 50px;
        left: 50px;

        width: 80px;
        height: 80px;

        background: radial-gradient(
            circle,
            #fff3b0,
            #ff8c00,
            #ff3300,
            #3d0000
        );

        box-shadow:
            0 0 40px #ff4400,
            0 0 80px #ff1100;

        animation:
            pulse 1.5s infinite alternate,
            flicker 0.2s infinite;
    }

    @keyframes rotateClockwise {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    @keyframes rotateCounter {
        from {
            transform: rotate(360deg);
        }

        to {
            transform: rotate(0deg);
        }
    }

    @keyframes pulse {
        from {
            transform: scale(0.95);
        }

        to {
            transform: scale(1.08);
        }
    }

    @keyframes flicker {

        0% { opacity: 0.90; }
        50% { opacity: 1; }
        100% { opacity: 0.92; }
    }

    /* =========================
       LOADING TEXT
    ========================= */

    .loading {
        margin-top: 40px;
        color: white;
        font-size: 1.1rem;
        letter-spacing: 2px;
    }

    .status {
        color: #cccccc;
        margin-top: 10px;
        opacity: 0.9;
    }

</style>
</head>

<body>

<div class="container">

    <div class="title">Inferno</div>

    <div class="spinner-container">

        <div class="outer-ring"></div>
        <div class="middle-ring"></div>
        <div class="inner-ring"></div>

    </div>

    <div class="loading">Initializing engine...</div>

    <div class="status" id="statusText">
        Loading assets...
    </div>

</div>

<script>

    const messages = [
        "Loading assets...",
        "Loading textures...",
        "Loading files...",
        "Preparing engine...",
        "Synchronizing modules...",
        "Connecting systems..."
    ];

    let index = 0;

    setInterval(() => {

        index++;

        document.getElementById("statusText").textContent =
            messages[index % messages.length];

    }, 2000);

    // ====================================================
    // C# COMMUNICATION BRIDGE (WebView2)
    // ====================================================

    function sendToCSharp(message) {

        if (window.chrome &&
            window.chrome.webview) {

            window.chrome.webview.postMessage(message);
        }
    }

    function receiveFromCSharp(data) {

        document.getElementById("statusText")
            .textContent = data;
    }

</script>

</body>
</html>
