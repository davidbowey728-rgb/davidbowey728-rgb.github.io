<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inferno</title>

<style>

:root{
    --background:#050505;
    --background2:#0d0d0d;
    --red:#8a0b0b;
    --bright:#ff5a36;
    --ember:#ff9b3d;
    --white:#f2f2f2;
    --gray:#9b9b9b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,sans-serif;
}

body{
    overflow:hidden;
    height:100vh;

    background:
        radial-gradient(circle at center,
        #170606 0%,
        #0b0b0b 45%,
        #000 100%);

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
}

.title{
    font-size:4rem;
    font-weight:700;
    letter-spacing:14px;

    color:var(--white);

    text-shadow:
        0 0 10px rgba(255,90,54,.4),
        0 0 25px rgba(255,90,54,.25);

    animation:glow 3s infinite alternate;
}

.spinner{
    position:relative;

    width:220px;
    height:220px;

    margin:40px auto;
}

.ring{
    position:absolute;

    inset:0;

    border-radius:50%;

    border:2px solid transparent;

    border-top-color:var(--bright);
    border-right-color:var(--red);

    animation:spin 6s linear infinite;

    box-shadow:
        0 0 20px rgba(255,80,50,.2);
}

.ring2{
    inset:20px;

    animation-direction:reverse;
    animation-duration:4s;
}

.core{

    position:absolute;

    top:50%;
    left:50%;

    width:90px;
    height:90px;

    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffd8a6,
            #ff743d,
            #4d0b0b
        );

    box-shadow:
        0 0 30px rgba(255,115,50,.5),
        0 0 80px rgba(255,90,54,.2);

    animation:pulse 2s infinite ease-in-out;
}

.loading{
    color:var(--white);
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.status{
    margin-top:15px;
    color:var(--gray);
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{

    0%{
        transform:translate(-50%,-50%) scale(.95);
    }

    100%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

@keyframes glow{

    from{
        opacity:.8;
    }

    to{
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        INFERNO
    </div>

    <div class="spinner">

        <div class="ring"></div>

        <div class="ring ring2"></div>

        <div class="core"></div>

    </div>

    <div class="loading">
        INITIALIZING
    </div>

    <div class="status" id="status">
        Loading assets...
    </div>

</div>

<script>

const messages = [
    "Loading assets...",
    "Loading textures...",
    "Loading modules...",
    "Building cache...",
    "Initializing engine..."
];

let index = 0;

setInterval(() => {

    index++;

    document.getElementById("status").innerText =
        messages[index % messages.length];

}, 2000);

function sendToCSharp(message){

    if(window.chrome?.webview){

        window.chrome.webview.postMessage(message);
    }
}

function receiveFromCSharp(message){

    document.getElementById("status").innerText = message;
}

</script>

</body>
</html>
